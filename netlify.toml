# Netlify: builds and publishes the web version on every push to main.
# Settings here take priority over the ones in the Netlify dashboard.

[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Paths that don't exist show the app's "not found" page (real pages are served first).
[[redirects]]
  from = "/*"
  to = "/+not-found.html"
  status = 404

# Always fetch the latest app shell and manifest; the hashed JS/CSS files can be cached.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
