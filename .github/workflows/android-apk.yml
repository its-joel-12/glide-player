# Builds the Glide Android APK on every push to main (and on demand from the Actions tab), signed with
# the same key as EAS, and publishes it as a GitHub release you can download on the phone.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions), set them with
# `npm run ci:secrets` (see README → "Builds on GitHub"):
#   KEYSTORE_BASE64    the keystore file (credentials/android/keystore.jks), base64-encoded
#   KEYSTORE_PASSWORD  KEY_ALIAS  KEY_PASSWORD   from credentials.json
# Optional, for an email when the build finishes (skipped if MAIL_USERNAME is not set):
#   MAIL_USERNAME  the Gmail address that sends it
#   MAIL_PASSWORD  a Gmail app password for it (myaccount.google.com/apppasswords), not the normal password
#   MAIL_TO        who gets it (defaults to MAIL_USERNAME)
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'public/**', 'netlify.toml', '.vscode/**', 'tests/**']
  workflow_dispatch:

# a newer push replaces a build that's still running
concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # caches Gradle's downloads between builds
      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      # The same checks as before a commit: types, lint, and the tests (incl. Android/web shader match).
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # FFmpeg's audio decoders (Dolby Digital AC-3, E-AC-3, TrueHD, DTS…) for sound phones can't decode
      # themselves. Built once with the NDK and cached; rebuilt only when scripts/ffmpeg/ changes.
      - uses: actions/cache@v4
        id: ffmpeg
        with:
          path: modules/glide-engine/android/src/main/jni/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg/*.sh', 'node_modules/react-native/gradle/libs.versions.toml') }}

      - name: FFmpeg audio decoders
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          NDK_VERSION=$(sed -n 's/^ndkVersion = "\(.*\)"/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$NDK" ]; then yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null; fi
          bash scripts/ffmpeg/build.sh "$NDK"

      - name: Signing key (from secrets; never stored in the repo)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing (run npm run ci:secrets on your PC)"; exit 1; fi
          mkdir -p credentials/android
          echo "$KEYSTORE_BASE64" | base64 -d > credentials/android/keystore.jks
          node -e "require('fs').writeFileSync('credentials.json', JSON.stringify({ android: { keystore: {
            keystorePath: 'credentials/android/keystore.jks',
            keystorePassword: process.env.KEYSTORE_PASSWORD,
            keyAlias: process.env.KEY_ALIAS,
            keyPassword: process.env.KEY_PASSWORD } } }))"

      - name: Build
        run: npm run build:apk:local

      - name: Find the APK
        id: apk
        run: echo "path=$(ls builds/*.apk | head -n 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: glide-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: Publish as a release (keeps the last 10)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Built from the Actions tab' }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" "$APK" --title "Glide build ${{ github.run_number }}" --notes "$NOTES" --target "${{ github.sha }}"
          echo "url=${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_OUTPUT"
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes
          done

      - name: Remove the signing key
        if: always()
        run: rm -f credentials.json credentials/android/keystore.jks

      # Emails when the build succeeds or fails (not when a newer push cancels it). Plain curl over SMTP.
      - name: Email the result
        if: success() || failure()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          STATUS: ${{ job.status }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.event.head_commit.message || 'Built from the Actions tab' }}
        run: |
          if [ -z "$MAIL_USERNAME" ] || [ -z "$MAIL_PASSWORD" ]; then echo "MAIL_USERNAME/MAIL_PASSWORD not set, no email"; exit 0; fi
          to="${MAIL_TO:-$MAIL_USERNAME}"
          if [ "$STATUS" = "success" ]; then
            subject="Glide build ${{ github.run_number }}: APK ready"
            body="The APK is ready to download: $RELEASE_URL"
          else
            subject="Glide build ${{ github.run_number }} failed"
            body="The build failed. Log: $RUN_URL"
          fi
          {
            printf 'From: Glide CI <%s>\r\nTo: %s\r\nSubject: %s\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n' "$MAIL_USERNAME" "$to" "$subject"
            printf '%s\n\nCommit: %s\n%s\n\nRun: %s\n' "$body" "${COMMIT%%$'\n'*}" "${{ github.sha }}" "$RUN_URL"
          } > mail.txt
          curl --silent --show-error --ssl-reqd --url "smtps://smtp.gmail.com:465" \
            --user "$MAIL_USERNAME:$MAIL_PASSWORD" --mail-from "$MAIL_USERNAME" --mail-rcpt "$to" --upload-file mail.txt
